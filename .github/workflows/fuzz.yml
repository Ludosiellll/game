name: Rules on random people

# The rules every plan must keep for anybody (core/src/test/kotlin/forma/core/fuzz, app/.../sim/LivesRulesTest), run
# on new random cases each time: the engine's rules for 90 s each, then people living weeks of the app for 20 minutes.
# Free on GitHub's runners for a public repository; nobody needs to watch it. A broken rule opens an issue with the
# smallest case and how to run it again (once per rule while the issue is open).
#
# «schedule» runs only from the repository's default branch: with this branch as the default, it runs every night too.
on:
  push:
    branches: [claude/nifty-lamport-9i1c9o]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time; a newer push waits for it rather than cutting it short.
concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: The engine's rules (gym, running), new cases
        env:
          FORMA_FUZZ_SEED: ${{ github.run_id }}
          FORMA_FUZZ_SECONDS: '90'
        run: ./gradlew :core:test --tests 'forma.core.fuzz.*' --rerun-tasks --continue

      - name: People living weeks of the app
        if: ${{ !cancelled() }}
        env:
          FORMA_FUZZ_SEED: ${{ github.run_id }}
          FORMA_LIVES_SECONDS: '1200'
        run: ./gradlew :app:testDebugUnitTest --tests 'forma.app.sim.LivesRulesTest' -Proborazzi.test.record=true

      - name: How many cases
        if: ${{ !cancelled() }}
        run: |
          echo "### Проверено случаев (набор ${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          cat core/build/fuzz/counts.txt app/build/fuzz/counts.txt 2>/dev/null | awk -F'\t' '{print "- " $1 ": " $2}' >> "$GITHUB_STEP_SUMMARY" || true

      - name: An issue for each rule broken
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One issue per title while it is open: the exact title, not a search (a search reads run_trial_faster and
          # run_trial_further alike). A listing that fails counts as none open — a duplicate beats a report lost.
          report() {
            open=$(gh issue list --state open --limit 200 --json title --jq "[.[] | select(.title == \"$1\")] | length" 2>/dev/null || echo 0)
            if [ "${open:-0}" = "0" ]; then gh issue create --title "$1" --body-file "$2"; fi
          }
          run="Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          found=0
          for f in core/build/fuzz/*.txt app/build/fuzz/*.txt; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in counts.txt) continue ;; esac
            found=1
            { cat "$f"; echo; echo "$run"; } > body.md
            report "Правило нарушено: $(basename "$f" .txt)" body.md
          done
          # Failed with no rule's report (a build broken, a crash outside the rules): said too, not left a red run.
          if [ "$found" = "0" ]; then
            { echo "Прогон правил упал, но ни одно правило не записало нарушения (сборка, падение вне правил)."; echo; echo "$run"; } > body.md
            report "Прогон правил сломался" body.md
          fi

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: rules-cases
          path: |
            core/build/fuzz/
            app/build/fuzz/
          if-no-files-found: ignore
