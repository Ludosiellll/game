name: Tests and Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this build as the app's update («Обновить» in the app takes it)
        type: boolean
        default: false

# Creating the release (the update everybody's app offers) needs to write the repository's releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Engine tests
        run: ./gradlew :core:test

      - name: App tests (Robolectric, sync, screenshots)
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORMA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORMA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forma.jks"
            echo "FORMA_KEYSTORE=$RUNNER_TEMP/forma.jks" >> "$GITHUB_ENV"
            echo "FORMA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signed with the stable release key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No FORMA_KEYSTORE_BASE64 / FORMA_KEYSTORE_PASSWORD secrets: the APK is signed with a throwaway debug key and will not install over a previous build."
            echo "⚠️ Debug-signed APK: add the FORMA_KEYSTORE_* secrets for installable updates." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      # A checked build for everybody: the app offers the latest release on start and installs it on «Обновить». Only
      # when asked — «[release]» in the commit message, or the manual run with «release» on — after every test above,
      # and only signed with the stable key: a build with another key would not install over the app.
      - name: Publish the update
        if: ${{ env.FORMA_KEYSTORE != '' && (contains(github.event.head_commit.message, '[release]') || inputs.release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SHA=$("$TOOLS/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$SHA" != "226c1da98209978b0cb5d1617389f75d158481e30edf0bb6a1373066fd8408bc" ]; then
            echo "::error::The APK is not signed with the stable key ($SHA): not published."
            exit 1
          fi
          if gh release view "v$CODE" > /dev/null 2>&1; then
            echo "Build $CODE is published already." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$APK" forma.apk
          gh release create "v$CODE" forma.apk --title "Форма — сборка $CODE" --notes-file .github/release-notes.md --target "$GITHUB_SHA" --latest
          echo "Published build $CODE as the app's update." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: forma-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: app/build/shots/
          retention-days: 7
          if-no-files-found: ignore

      # A failed test's full stack trace: the log shows only the exception and its line.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: |
            core/build/test-results/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
